<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Why bot traffic matters: four numbers</title>
  <desc id="desc">Googlebot 4.5 percent of all HTML traffic; AI user-action crawling grew 15x in 2025; 40 percent of bot traffic from the US; 6 percent of Cloudflare traffic blocked as malicious.</desc>
  <rect width="720" height="420" fill="#FAF9F5" rx="12"/>

  <text x="40" y="52" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.08em" fill="#87867F">BOT TRAFFIC, IN FOUR NUMBERS</text>
  <line x1="40" y1="68" x2="680" y2="68" stroke="#D1CFC5" stroke-width="1.5"/>

  <g font-family="ui-serif, Georgia, serif">
    <!-- 4.5% Googlebot -->
    <text x="40" y="150" font-size="46" fill="#B04A3F" font-weight="600">4.5%</text>
    <text x="40" y="186" font-size="16" fill="#3D3D3A">of all HTML request traffic</text>
    <text x="40" y="210" font-size="16" fill="#3D3D3A">is Googlebot alone.</text>

    <!-- 15x AI crawling -->
    <text x="40" y="272" font-size="46" fill="#D97757" font-weight="600">15x</text>
    <text x="40" y="308" font-size="16" fill="#3D3D3A">AI "user action" crawling</text>
    <text x="40" y="332" font-size="16" fill="#3D3D3A">grew in 2025.</text>

    <!-- 40% US origin -->
    <text x="400" y="150" font-size="46" fill="#788C5D" font-weight="600">40%</text>
    <text x="400" y="186" font-size="16" fill="#3D3D3A">of global bot traffic</text>
    <text x="400" y="210" font-size="16" fill="#3D3D3A">originates from the US.</text>

    <!-- 6% malicious -->
    <text x="400" y="272" font-size="46" fill="#141413" font-weight="600">6%</text>
    <text x="400" y="308" font-size="16" fill="#3D3D3A">of traffic across Cloudflare</text>
    <text x="400" y="332" font-size="16" fill="#3D3D3A">was blocked as malicious.</text>
  </g>

  <line x1="40" y1="380" x2="680" y2="380" stroke="#D1CFC5" stroke-width="1.5"/>
  <text x="40" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.05em" fill="#87867F">SOURCE: IMPERVA/THALES 2026 BAD BOT REPORT · CLOUDFLARE 2025 RADAR</text>
</svg>